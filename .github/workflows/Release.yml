name: Build And Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version Name'
        required: true

jobs:
  release:
    runs-on: macOS-14
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 15.1
    - name: Install Homebrew kegs
      run: make setup-brew
    - name: Build for iOS
      run: make build-for-testing-ios
  
    - name: Verify podspec version matches tag
      run: |
        PODSPEC_VERSION=$(sed -n 's/^[[:space:]]*spec\.version[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' MiddlewareRum.podspec | head -1)
        if [ "v${PODSPEC_VERSION}" != "$TAG" ]; then
          echo "MiddlewareRum.podspec version (${PODSPEC_VERSION}) does not match release tag (${TAG})."
          echo "Bump spec.version in MiddlewareRum.podspec (and VERSION_STRING in MiddlewareConstants.swift) first."
          exit 1
        fi
      env:
        TAG: ${{ github.event.inputs.versionName }}

    - name: Create and push tag
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        # Idempotent so re-running a partially-failed release does not abort here.
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$REMOTE_SHA" ] || REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ "$REMOTE_SHA" = "$(git rev-parse HEAD)" ]; then
            echo "Tag $TAG already exists on origin at this commit; skipping."
            exit 0
          fi
          echo "Tag $TAG already exists on origin but points at $REMOTE_SHA, not $(git rev-parse HEAD)."
          exit 1
        fi
        git tag -a $TAG -m "Release $TAG"
        git push origin $TAG
      env:
        TAG: ${{ github.event.inputs.versionName }}

    # Publishes the pod to CocoaPods trunk. Runs after the tag push because
    # trunk clones the source at tag v<spec.version>. Requires the
    # COCOAPODS_TRUNK_TOKEN repository secret (from `pod trunk register`,
    # the account must be an owner of the MiddlewareRum pod).
    # `pod trunk push --synchronous` waits for trunk to commit the spec to the
    # CocoaPods/Specs repo and refresh the CDN version index. That second write
    # is eventually consistent and occasionally errors out ("An internal server
    # error occurred") even though the version is accepted. Once trunk has the
    # version, re-pushing is impossible ("Unable to accept duplicate entry"), so
    # a hard failure here would permanently block the release steps below.
    # Treat "version is registered on trunk" as success.
    - name: Push podspec to CocoaPods trunk
      run: |
        set -uo pipefail
        pod --version

        POD_NAME=MiddlewareRum
        VERSION="${TAG#v}"

        published() {
          curl -sf --max-time 30 "https://trunk.cocoapods.org/api/v1/pods/${POD_NAME}" \
            | python3 -c "import json,sys; sys.exit(0 if '${VERSION}' in [v['name'] for v in json.load(sys.stdin).get('versions',[])] else 1)"
        }

        if published; then
          echo "${POD_NAME} ${VERSION} is already registered on CocoaPods trunk; skipping push."
          exit 0
        fi

        if pod trunk push "${POD_NAME}.podspec" --allow-warnings --synchronous; then
          echo "Pushed ${POD_NAME} ${VERSION} to CocoaPods trunk."
          exit 0
        fi

        echo "::warning::pod trunk push exited non-zero; checking whether ${VERSION} was accepted anyway."
        for _ in $(seq 1 10); do
          sleep 30
          if published; then
            echo "::warning::${POD_NAME} ${VERSION} is registered on trunk despite the push error. Treating as published."
            echo "The CDN version index may take a few more minutes to serve it."
            exit 0
          fi
        done

        echo "::error::${POD_NAME} ${VERSION} was not accepted by CocoaPods trunk."
        exit 1
      env:
        COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        TAG: ${{ github.event.inputs.versionName }}

    - name: Build Changelog
      id: github_release
      uses: mikepenz/release-changelog-builder-action@v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      uses: mikepenz/action-gh-release@v1
      with:
        body: ${{steps.github_release.outputs.changelog}}
        tag_name: ${{ github.event.inputs.versionName }}
