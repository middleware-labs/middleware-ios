name: Build And Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version Name'
        required: true

jobs:
  release:
    runs-on: macOS-14
    steps:
    - uses: actions/checkout@v4
    - name: Verify CHANGELOG.md has a section for this version
      run: python3 scripts/changelog.py check "$TAG"
      env:
        TAG: ${{ github.event.inputs.versionName }}
    - name: Verify podspec version matches tag
      run: |
        PODSPEC_VERSION=$(sed -n 's/^[[:space:]]*spec\.version[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' MiddlewareRum.podspec | head -1)
        if [ "v${PODSPEC_VERSION}" != "$TAG" ]; then
          echo "MiddlewareRum.podspec version (${PODSPEC_VERSION}) does not match release tag (${TAG})."
          echo "Bump spec.version in MiddlewareRum.podspec (and VERSION_STRING in MiddlewareConstants.swift) first."
          exit 1
        fi
      env:
        TAG: ${{ github.event.inputs.versionName }}
    # Runs before the slow steps, so a release that can't succeed fails in seconds.
    - name: Verify an existing tag points at this commit
      run: |
        REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
        [ -n "$REMOTE_SHA" ] || REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
        if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$(git rev-parse HEAD)" ]; then
          echo "::error::Tag $TAG already exists at $REMOTE_SHA, not at this commit ($(git rev-parse HEAD))."
          echo "To finish that release, use Re-run failed jobs on its original run. To release this commit, bump the version first."
          exit 1
        fi
      env:
        TAG: ${{ github.event.inputs.versionName }}
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 15.1
    - name: Install Homebrew kegs
      run: make setup-brew
    - name: Build for iOS
      run: make build-for-testing-ios


    - name: Create and push tag
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        # Idempotent so re-running a partially-failed release does not abort here.
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$REMOTE_SHA" ] || REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ "$REMOTE_SHA" = "$(git rev-parse HEAD)" ]; then
            echo "Tag $TAG already exists on origin at this commit; skipping."
            exit 0
          fi
          echo "Tag $TAG already exists on origin but points at $REMOTE_SHA, not $(git rev-parse HEAD)."
          exit 1
        fi
        git tag -a $TAG -m "Release $TAG"
        git push origin $TAG
      env:
        TAG: ${{ github.event.inputs.versionName }}

    # Publishes the pod to our own specs repo, where new versions live now that
    # CocoaPods trunk is going read-only. Runs after the tag push because
    # validation clones the source at tag v<spec.version>. Requires the
    # COCOAPODS_SPECS_DEPLOY_KEY repository secret: the private half of a deploy
    # key with write access on middleware-labs/cocoapods-specs. Skips a version
    # that is already there, so re-running a partially-failed release is safe.
    - name: Publish podspec to the Middleware specs repo
      run: |
        set -euo pipefail

        POD_NAME=MiddlewareRum
        VERSION="${TAG#v}"
        SPECS_REPO=middleware-specs

        if [ -z "${COCOAPODS_SPECS_DEPLOY_KEY:-}" ]; then
          echo "::error::The COCOAPODS_SPECS_DEPLOY_KEY secret is not set."
          exit 1
        fi

        KEY_FILE="$(mktemp)"
        trap 'rm -f "$KEY_FILE"' EXIT
        printf '%s\n' "$COCOAPODS_SPECS_DEPLOY_KEY" > "$KEY_FILE"
        chmod 600 "$KEY_FILE"
        export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

        pod repo add "$SPECS_REPO" git@github.com:middleware-labs/cocoapods-specs.git

        if [ -d "${CP_REPOS_DIR:-$HOME/.cocoapods/repos}/$SPECS_REPO/$POD_NAME/$VERSION" ]; then
          echo "${POD_NAME} ${VERSION} is already in the specs repo; skipping push."
          exit 0
        fi

        pod repo push "$SPECS_REPO" "${POD_NAME}.podspec" --allow-warnings \
          --sources=https://github.com/middleware-labs/cocoapods-specs.git,https://cdn.cocoapods.org/
      env:
        COCOAPODS_SPECS_DEPLOY_KEY: ${{ secrets.COCOAPODS_SPECS_DEPLOY_KEY }}
        TAG: ${{ github.event.inputs.versionName }}

    # Also publishes to CocoaPods trunk, for apps that have not added the specs
    # repo as a source. Trunk stops accepting pods permanently on 2026-12-02, so
    # delete this step then. It never fails the release: the specs repo above is
    # what the release depends on. Requires the
    # COCOAPODS_TRUNK_TOKEN repository secret (from `pod trunk register`,
    # the account must be an owner of the MiddlewareRum pod).
    # No --synchronous: it clones the whole CocoaPods/Specs repo, about 11 minutes,
    # only to validate against pods pushed moments ago, and our dependencies are
    # long established. After accepting a spec, `pod trunk push` refreshes the CDN
    # version index. That write is eventually consistent and occasionally errors out ("An internal server
    # error occurred") even though the version is accepted. Once trunk has the
    # version, re-pushing is impossible ("Unable to accept duplicate entry"), so
    # a hard failure here would permanently block the release steps below.
    # Treat "version is registered on trunk" as success.
    - name: Push podspec to CocoaPods trunk
      run: |
        set -uo pipefail
        pod --version

        POD_NAME=MiddlewareRum
        VERSION="${TAG#v}"

        published() {
          curl -sf --max-time 30 "https://trunk.cocoapods.org/api/v1/pods/${POD_NAME}" \
            | python3 -c "import json,sys; sys.exit(0 if '${VERSION}' in [v['name'] for v in json.load(sys.stdin).get('versions',[])] else 1)"
        }

        if published; then
          echo "${POD_NAME} ${VERSION} is already registered on CocoaPods trunk; skipping push."
          exit 0
        fi

        PUSH_LOG="$(mktemp)"
        pod trunk push "${POD_NAME}.podspec" --allow-warnings 2>&1 | tee "$PUSH_LOG"
        if [ "${PIPESTATUS[0]}" -eq 0 ]; then
          echo "Pushed ${POD_NAME} ${VERSION} to CocoaPods trunk."
          exit 0
        fi

        # A refusal is final, so don't wait for the version to appear.
        if grep -qi "read-only" "$PUSH_LOG"; then
          echo "::warning::CocoaPods trunk is read-only, so ${POD_NAME} ${VERSION} was not pushed to it. It is still available from the specs repo."
          exit 0
        fi

        echo "::warning::pod trunk push exited non-zero; checking whether ${VERSION} was accepted anyway."
        for _ in $(seq 1 10); do
          sleep 30
          if published; then
            echo "::warning::${POD_NAME} ${VERSION} is registered on trunk despite the push error. Treating as published."
            echo "The CDN version index may take a few more minutes to serve it."
            exit 0
          fi
        done

        echo "::warning::${POD_NAME} ${VERSION} was not accepted by CocoaPods trunk. It is still available from the specs repo."
      env:
        COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        TAG: ${{ github.event.inputs.versionName }}

    - name: Read release notes from CHANGELOG.md
      id: github_release
      run: |
        {
          echo 'changelog<<CHANGELOG_EOF'
          python3 scripts/changelog.py notes "$TAG"
          echo 'CHANGELOG_EOF'
        } >> "$GITHUB_OUTPUT"
      env:
        TAG: ${{ github.event.inputs.versionName }}

    - name: Create Release
      uses: mikepenz/action-gh-release@v1
      with:
        body: ${{steps.github_release.outputs.changelog}}
        tag_name: ${{ github.event.inputs.versionName }}
